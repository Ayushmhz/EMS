<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up | Event Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            width: 100%;
            max-width: 550px;
            /* Increased from 450px */
            margin: 4rem auto;
            padding: 3.5rem;
            /* Increased padding */
        }

        .tabs {
            display: flex;
            gap: 1.5rem;
            /* More space between tabs */
            margin-bottom: 3rem;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 1rem;
            /* More padding for tabs */
            cursor: pointer;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            /* Added default border */
            color: var(--text-muted);
            font-weight: 600;
            font-size: 1.1rem;
            /* Slightly larger text */
            transition: 0.3s;
        }

        .tab.active {
            border-color: var(--primary);
            color: white;
            background: rgba(99, 102, 241, 0.05);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        .form-group label {
            font-size: 1rem !important;
            margin-bottom: 0.75rem !important;
        }

        input,
        select {
            padding: 1rem !important;
            /* Larger input fields */
            font-size: 1rem !important;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 3.2rem !important;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-muted);
            padding: 0;
            line-height: 1;
            transition: color 0.2s, transform 0.2s;
            user-select: none;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        .input-icon-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-wrapper input,
        .input-icon-wrapper select {
            padding-left: 2.8rem !important;
            width: 100%;
        }

        .input-icon {
            position: absolute;
            left: 0.9rem;
            color: var(--text-muted);
            pointer-events: none;
            z-index: 1;
            display: flex;
            align-items: center;
            opacity: 0.6;
        }

        .switch-form-text {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .switch-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-left: 0.3rem;
        }

        .switch-link:hover {
            color: var(--secondary);
            text-decoration: underline;
        }

        /* Smooth slide animations */
        .form-slide-in {
            animation: slideIn 0.4s ease-out forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
        <div class="glass auth-container animate-fade">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="logo" style="cursor: pointer;" onclick="window.location.href='index.html'">Event Management <span style="color: var(--primary);">System</span></div>
            </div>

            <div class="tabs">
                <div class="tab active" id="auth-tab" style="cursor: default;">Login</div>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        </span>
                        <input type="email" id="login-email" required placeholder="name@college.edu">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper input-icon-wrapper">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" id="login-password" required placeholder="••••••••">
                        <button type="button" class="toggle-password" onclick="togglePassword('login-password', this)"
                            title="Show/Hide password">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="eye-icon">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                                <path
                                    d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                                <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                                <line x1="2" x2="22" y1="2" y2="22" />
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%;">Log In</button>
                <div class="switch-form-text" id="login-toggle-link">
                    Don't have an account? <span class="switch-link" onclick="switchTab('register')">Sign Up</span>
                </div>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        <input type="text" id="reg-name" required placeholder="Your Full Name">
                    </div>
                </div>
                <div class="form-group">
                    <label>Faculty</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 6 3 6 3s6-1 6-3v-5"/></svg>
                        </span>
                        <select id="reg-faculty" required>
                            <option value="" disabled selected>Select your faculty</option>
                            <option value="BCA" style="color: black;">BCA</option>
                            <option value="BBS" style="color: black;">BBS</option>
                            <option value="BSW" style="color: black;">BSW</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-icon-wrapper">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        </span>
                        <input type="email" id="reg-email" required placeholder="name@college.edu">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper input-icon-wrapper">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" id="reg-password" required placeholder="••••••••">
                        <button type="button" class="toggle-password" onclick="togglePassword('reg-password', this)"
                            title="Show/Hide password">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="eye-icon">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                                <path
                                    d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                                <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                                <line x1="2" x2="22" y1="2" y2="22" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div style="margin-top: -1rem; margin-bottom: 1.5rem;">
                    <small style="display: block; color: var(--text-muted); font-size: 0.8rem; line-height: 1.4;">
                        ✓ Min 6 characters <br>
                        ✓ Must include letters and numbers
                    </small>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
                <div class="switch-form-text">
                    Already have an account? <span class="switch-link" onclick="switchTab('login')">Login</span>
                </div>
            </form>

            <div style="text-align: center; margin-top: 2rem;">
                <p id="admin-notice"
                    style="font-size: 0.85rem; color: #80ff80; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.4rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        style="margin-bottom: 1px;">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    Admin restricted access only.
                </p>
                <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">← Back
                    to Home</a>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const isPassword = input.type === 'password';

            // Icons
            const eyeOpen = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
            const eyeClosed = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`;

            if (isPassword) {
                input.type = 'text';
                btn.innerHTML = eyeOpen; // Eyes OPEN -> password SHOWN
            } else {
                input.type = 'password';
                btn.innerHTML = eyeClosed; // Eyes CLOSED -> password HIDDEN
            }
        }
    </script>
    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const authTab = document.getElementById('auth-tab');

            loginForm.classList.remove('active', 'form-slide-in');
            regForm.classList.remove('active', 'form-slide-in');

            if (tab === 'login') {
                loginForm.classList.add('active', 'form-slide-in');
                if (authTab) {
                    authTab.textContent = (window.location.hash === '#admin') ? 'Admin Login Panel' : 'Login';
                    authTab.classList.add('active');
                }
                window.location.hash = (window.location.hash === '#admin') ? '#admin' : '#login';
            } else {
                regForm.classList.add('active', 'form-slide-in');
                if (authTab) {
                    authTab.textContent = 'Student Sign Up';
                    authTab.classList.add('active');
                }
                window.location.hash = '#register';
            }
        }

        // Context awareness based on URL
        const loginBtn = document.getElementById('login-btn');
        const adminNotice = document.getElementById('admin-notice');

        if (window.location.hash === '#admin') {
            const adminTab = document.getElementById('auth-tab');
            if (adminTab) {
                adminTab.textContent = 'Admin Login Panel';
                adminTab.style.borderBottom = 'none';
                adminTab.style.background = 'transparent';
                adminTab.style.cursor = 'default';
                adminTab.style.fontSize = '1.15rem';
                adminTab.style.fontWeight = '700';
                adminTab.style.color = '#00a2ff';
                adminTab.style.textShadow = 'none';
                adminTab.style.letterSpacing = '1px';
                adminTab.style.textTransform = 'uppercase';
            }

            loginBtn.textContent = 'Access Portal';
            if (adminNotice) adminNotice.style.display = 'flex';
            const loginToggle = document.getElementById('login-toggle-link');
            if (loginToggle) loginToggle.style.display = 'none';
            switchTab('login');
        } else {
            const loginTab = document.getElementById('auth-tab');
            if (loginTab) {
                loginTab.textContent = 'Login';
                loginTab.style.borderBottom = '';
                loginTab.style.background = '';
                loginTab.style.cursor = 'default';
                loginTab.style.fontSize = '';
                loginTab.style.fontWeight = '';
                loginTab.style.color = '';
                loginTab.style.textShadow = '';
                loginTab.style.letterSpacing = '';
                loginTab.style.textTransform = '';
            }
            
            loginBtn.textContent = 'Log In';
            if (adminNotice) adminNotice.style.display = 'none';
            if (window.location.hash === '#register') {
                switchTab('register');
            }
        }

        // Handle browser back/forward and direct hash changes
        window.addEventListener('hashchange', () => {
            if (window.location.hash === '#register') {
                switchTab('register');
            } else if (window.location.hash === '#login' || !window.location.hash) {
                switchTab('login');
            }
        });
    </script>
</body>

</html>
